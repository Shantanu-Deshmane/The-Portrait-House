<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>The Portrait House | Luxury Photography Studio</title>

  <!-- FOUC Prevention: Apply theme before React renders -->
  <script>
    (function () {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <meta name="description"
    content="The Portrait House is a luxury photography studio in Karad, Maharashtra, specializing in high-end monochrome portraiture and timeless visual narratives." />
  <meta name="keywords"
    content="photography, portrait studio, Karad, Maharashtra, monochrome portraiture, luxury photography, The Portrait House" />
  <link rel="canonical" href="https://theprotraithouse.in/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://theprotraithouse.in/" />
  <meta property="og:title" content="The Portrait House | Luxury Photography Studio" />
  <meta property="og:description"
    content="Capturing the timeless soul through sophisticated light and shadow. Luxury photography studio in Karad, Maharashtra." />
  <meta property="og:image" content="https://theprotraithouse.in/assets/engagement/img1.webp" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://theprotraithouse.in/" />
  <meta property="twitter:title" content="The Portrait House | Luxury Photography Studio" />
  <meta property="twitter:description"
    content="Capturing the timeless soul through sophisticated light and shadow. Luxury photography studio in Karad, Maharashtra." />
  <meta property="twitter:image" content="https://theprotraithouse.in/assets/engagement/img1.webp" />

  <!-- Fonts: preconnect + display=swap prevents render-blocking FOIT -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <!-- dns-prefetch as fallback for older browsers -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet" />
  </noscript>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined&display=block" rel="stylesheet"
    media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined&display=block" rel="stylesheet" />
  </noscript>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/logo.png" />

    },

</head>
